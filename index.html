<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luz & Verdad — Audiolibros Cristianos</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="apple-touch-icon" href="img/logo.png">

<style>
:root{
  --bg:#f7f4ef; --surface:#fff; --surface-2:#f0ebe3;
  --text:#221f1b; --muted:#7d7469;
  --accent:#b8863b; --accent-2:#8c6220;
  --border:#e4ddd2;
  --shadow:0 10px 30px rgba(40,30,10,.08);
  --shadow-lg:0 20px 50px rgba(40,30,10,.15);
  --radius:16px; --player-h:100px;
  --logo-bg:#0d0d0d;
  --hl:rgba(184,134,59,.28);
}
[data-theme="dark"]{
  --bg:#100e0c; --surface:#1b1815; --surface-2:#242019;
  --text:#f3ede4; --muted:#9c9287;
  --accent:#d9a441; --accent-2:#f0c368;
  --border:#2f2924;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --shadow-lg:0 20px 50px rgba(0,0,0,.7);
  --hl:rgba(217,164,65,.30);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.55;
  padding-bottom:calc(var(--player-h) + 24px);
  transition:background .3s, color .3s;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;}
::selection{background:var(--accent);color:#fff;}

.site-header{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;
  padding:16px 28px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.brand .logo{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;
  background:var(--logo-bg);
  box-shadow:0 6px 18px rgba(0,0,0,.35),
             0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
  display:grid;place-items:center;
  transition:transform .25s, box-shadow .25s;
}
.brand .logo:hover{
  transform:translateY(-1px) rotate(-3deg);
  box-shadow:0 10px 26px color-mix(in srgb, var(--accent) 45%, transparent),
             0 0 0 1px var(--accent);
}
.brand .logo img,
.brand .logo svg{width:100%;height:100%;object-fit:cover;display:block;}
.brand h1{font-size:19px;line-height:1.1;}
.brand p{margin:0;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}

.header-actions{margin-left:auto;display:flex;align-items:center;gap:10px;}
.search-wrap{position:relative;}
.search-wrap input{
  width:230px;padding:10px 14px 10px 36px;
  border-radius:99px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);
  font-size:14px;outline:none;transition:.2s;
}
.search-wrap input:focus{border-color:var(--accent);width:270px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent);}
.search-wrap::before{
  content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font-size:13px;opacity:.55;pointer-events:none;
}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;font-size:17px;
  border:1px solid var(--border);background:var(--surface);transition:.2s;
}
.icon-btn:hover{background:var(--surface-2);transform:translateY(-1px);}

.hero{
  padding:44px 28px 12px;max-width:1280px;margin:0 auto;
  display:flex;align-items:center;gap:22px;
}
.hero-text{flex:1;}
.hero .eyebrow{
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin-bottom:10px;
}
.hero h2{font-size:clamp(26px,4vw,40px);line-height:1.15;max-width:640px;}
.hero p{color:var(--muted);max-width:560px;margin-top:10px;font-size:15px;}
.hero .hero-logo{
  width:110px;height:110px;border-radius:50%;flex-shrink:0;
  overflow:hidden;background:var(--logo-bg);
  box-shadow:0 18px 45px rgba(0,0,0,.28),
             0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent);
  display:grid;place-items:center;
  animation:float 6s ease-in-out infinite;
}
.hero .hero-logo img,
.hero .hero-logo svg{width:100%;height:100%;object-fit:cover;display:block;}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}
@media(max-width:720px){ .hero .hero-logo{display:none;} }

.filters{
  display:flex;gap:9px;overflow-x:auto;padding:22px 28px 8px;
  max-width:1280px;margin:0 auto;scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:8px 17px;border-radius:99px;font-size:13.5px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  transition:.2s;white-space:nowrap;
}
.chip:hover{border-color:var(--accent);color:var(--text);}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 5px 16px color-mix(in srgb,var(--accent) 35%,transparent);}

.library{
  max-width:1280px;margin:0 auto;padding:18px 28px 40px;
  display:grid;gap:20px;
  grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
}
.card{
  position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;cursor:pointer;
  transition:transform .25s cubic-bezier(.2,.8,.3,1), box-shadow .25s, border-color .25s;
  animation:fadeUp .45s backwards;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);
  border-color:color-mix(in srgb,var(--accent) 45%,var(--border));}
.cover{
  aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden;
}
.cover::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.22), transparent 55%);
}
.cover .cover-icon{font-size:56px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));z-index:1;}
.cover .cover-letter{
  position:absolute;right:-10px;bottom:-30px;font-size:120px;font-weight:800;
  font-family:Georgia,serif;color:rgba(255,255,255,.10);line-height:1;z-index:0;
}
.play-fab{
  position:absolute;right:12px;bottom:12px;z-index:3;
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;font-size:15px;color:#fff;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 22px rgba(0,0,0,.35);
  transform:scale(.85);opacity:0;transition:.25s;
}
.card:hover .play-fab{transform:scale(1);opacity:1;}
.play-fab:hover{transform:scale(1.1);}
.card-body{padding:14px 15px 16px;}
.card-body .tag{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);margin-bottom:6px;
}
.card-body h3{font-size:16.5px;line-height:1.25;margin-bottom:3px;}
.card-body .author{font-size:12.5px;color:var(--muted);}
.card-body .meta{
  display:flex;align-items:center;gap:5px;margin-top:9px;
  font-size:11.5px;color:var(--muted);
}

.empty{
  grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted);
}
.empty .big{font-size:48px;margin-bottom:14px;opacity:.6;}

.overlay{
  position:fixed;inset:0;z-index:60;
  background:rgba(15,10,5,.55);backdrop-filter:blur(4px);
  display:grid;place-items:end center;
  opacity:0;pointer-events:none;transition:opacity .28s;
}
.overlay.open{opacity:1;pointer-events:auto;}
@media(min-width:721px){ .overlay{place-items:center;} }
.sheet{
  width:100%;max-width:640px;max-height:88vh;
  background:var(--surface);border:1px solid var(--border);
  border-radius:24px 24px 0 0;padding:22px 26px 30px;
  overflow-y:auto;position:relative;
  transform:translateY(28px);transition:transform .32s cubic-bezier(.2,.9,.3,1);
}
.overlay.open .sheet{transform:none;}
@media(min-width:721px){ .sheet{border-radius:24px;max-height:84vh;} }
.sheet-close{
  position:absolute;top:16px;right:16px;
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;font-size:15px;
  background:var(--surface-2);color:var(--muted);transition:.2s;
}
.sheet-close:hover{background:var(--border);color:var(--text);}
.sheet-head{display:flex;gap:15px;align-items:center;padding-right:44px;margin-bottom:16px;}
.sheet-cover{
  width:74px;height:74px;border-radius:14px;flex-shrink:0;
  display:grid;place-items:center;font-size:32px;box-shadow:var(--shadow);overflow:hidden;
}
.sheet-cover img{width:100%;height:100%;object-fit:cover;}
.sheet-head h2{font-size:20px;line-height:1.2;}
.sheet-head p{margin:4px 0 0;font-size:13px;color:var(--muted);}

.chapter-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.chapter-item{
  display:flex;align-items:center;gap:13px;
  padding:12px 14px;border-radius:12px;cursor:pointer;
  border:1px solid transparent;transition:.18s;
}
.chapter-item:hover{background:var(--surface-2);border-color:var(--border);}
.chapter-item.active{
  background:color-mix(in srgb,var(--accent) 12%,transparent);
  border-color:color-mix(in srgb,var(--accent) 40%,transparent);
}
.chapter-num{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;font-size:12.5px;font-weight:700;
  background:var(--surface-2);color:var(--muted);
}
.chapter-item.active .chapter-num{background:var(--accent);color:#fff;}
.chapter-item .ch-title{font-size:14px;font-weight:500;flex:1;}
.chapter-item .ch-state{font-size:13px;color:var(--accent);opacity:0;transition:.2s;}
.chapter-item.active .ch-state,
.chapter-item:hover .ch-state{opacity:1;}

.reader-head{
  display:flex;align-items:center;gap:10px;margin-bottom:18px;
  padding-bottom:14px;border-bottom:1px solid var(--border);
}
.reader-head .reader-badge{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:var(--accent);color:#fff;padding:4px 9px;border-radius:7px;
}
.reader-head h3{font-size:17px;flex:1;}
.reader-body p{
  font-family:Georgia,"Times New Roman",serif;
  font-size:17.5px;line-height:1.85;color:var(--text);
  margin:0 0 18px;padding:6px 0;transition:background .3s;
  border-radius:8px;
}
.reader-body p.current-para{
  background:color-mix(in srgb, var(--accent) 8%, transparent);
  padding:10px 14px;margin-left:-8px;margin-right:-8px;
}
.reader-body span.w{transition:background .15s, color .15s;border-radius:4px;padding:0 1px;}
.reader-body span.w.hl{background:var(--hl);color:var(--accent-2);font-weight:600;}

.player{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  height:var(--player-h);
  display:grid;
  grid-template-columns:minmax(180px,1fr) minmax(280px,2fr) minmax(210px,1fr);
  align-items:center;gap:18px;padding:0 24px;
  background:color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  box-shadow:0 -8px 30px rgba(0,0,0,.10);
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.2,.9,.3,1);
}
.player.visible{transform:none;}

.player-info{display:flex;align-items:center;gap:12px;min-width:0;}
.player-cover{
  width:52px;height:52px;border-radius:12px;flex-shrink:0;
  display:grid;place-items:center;font-size:22px;
  box-shadow:var(--shadow);overflow:hidden;background:var(--logo-bg);
}
.player-cover img,
.player-cover svg{width:100%;height:100%;object-fit:cover;display:block;}
.player-meta{min-width:0;}
.player-meta strong{
  display:block;font-size:13.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.player-meta span{
  display:block;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;
}
.player-center{display:flex;flex-direction:column;gap:7px;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:14px;}
.player-controls button{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-size:15px;color:var(--muted);transition:.18s;
}
.player-controls button:hover{background:var(--surface-2);color:var(--text);}
.player-controls .main{
  width:46px;height:46px;font-size:17px;color:#fff;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);
}
.player-controls .main:hover{transform:scale(1.07);}

.player-progress{display:flex;align-items:center;gap:11px;}
.player-progress span{
  font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
  min-width:38px;text-align:center;
}
.player-right{display:flex;align-items:center;justify-content:flex-end;gap:10px;}
.voice-select{
  max-width:150px;padding:7px 9px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-size:12px;outline:none;cursor:pointer;
}
.voice-select:focus{border-color:var(--accent);}
.speed{
  font-size:12px;font-weight:700;padding:6px 10px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  transition:.18s;min-width:44px;
}
.speed:hover{border-color:var(--accent);color:var(--accent);}

input[type="range"]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:18px;background:transparent;cursor:pointer;--progress:0%;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:5px;border-radius:99px;
  background:linear-gradient(90deg,
    var(--accent) 0%, var(--accent) var(--progress),
    var(--border) var(--progress), var(--border) 100%);
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:13px;height:13px;border-radius:50%;margin-top:-4px;
  background:var(--accent);border:2px solid var(--surface);
  box-shadow:0 1px 5px rgba(0,0,0,.35);transition:transform .15s;
}
input[type="range"]:hover::-webkit-slider-thumb{transform:scale(1.25);}
input[type="range"]::-moz-range-track{height:5px;border-radius:99px;background:var(--border);}
input[type="range"]::-moz-range-progress{height:5px;border-radius:99px;background:var(--accent);}
input[type="range"]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;
  background:var(--accent);border:2px solid var(--surface);
}

@media(max-width:980px){
  .player{
    grid-template-columns:1fr;height:auto;padding:12px 16px 14px;gap:10px;
  }
  :root{--player-h:170px;}
  .player-info{order:1;}
  .player-center{order:3;}
  .player-right{order:2;justify-content:center;}
  .search-wrap input{width:150px;}
  .search-wrap input:focus{width:180px;}
}
@media(max-width:640px){
  .site-header{padding:12px 16px;gap:10px;}
  .brand p{display:none;}
  .brand h1{font-size:16px;}
  .brand .logo{width:40px;height:40px;}
  .hero{padding:28px 16px 6px;}
  .filters{padding:16px 16px 6px;}
  .library{padding:14px 16px 30px;gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .cover .cover-icon{font-size:42px;}
  .card-body{padding:11px 12px 13px;}
  .card-body h3{font-size:14.5px;}
  .voice-select{max-width:110px;}
  :root{--player-h:184px;}
  .reader-body p{font-size:16px;}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">
    <div class="logo" title="Luz & Verdad">
      <img src="img/logo.png" alt="Luz & Verdad"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
        <circle cx="50" cy="50" r="50" fill="#0d0d0d"/>
        <path fill="#ffffff" d="M62 8 C 58 26, 76 40, 78 60 C 80 78, 66 92, 50 95 C 62 84, 68 68, 62 52 C 56 36, 58 20, 62 8 Z"/>
        <path fill="#ffffff" d="M40 34 C 32 46, 22 58, 26 74 C 29 86, 40 93, 52 93 C 42 84, 38 72, 42 60 C 45 50, 44 42, 40 34 Z"/>
      </svg>
    </div>
    <div>
      <h1>Luz &amp; Verdad</h1>
      <p>Audiolibros cristianos</p>
    </div>
  </div>
  <div class="header-actions">
    <div class="search-wrap">
      <input type="search" id="search" placeholder="Buscar libro o autor…" aria-label="Buscar">
    </div>
    <button class="icon-btn" id="themeToggle" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
  </div>
</header>

<section class="hero">
  <div class="hero-text">
    <div class="eyebrow">La Palabra en audio</div>
    <h2>La Escritura, narrada para que la escuches donde estés.</h2>
    <p>Antiguo y Nuevo Testamento, devocionales y meditaciones en español, para tu estudio, tu oración o tu descanso.</p>
  </div>
  <div class="hero-logo" aria-hidden="true">
    <img src="img/logo.png" alt=""
         onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="display:none">
      <circle cx="50" cy="50" r="50" fill="#0d0d0d"/>
      <path fill="#ffffff" d="M62 8 C 58 26, 76 40, 78 60 C 80 78, 66 92, 50 95 C 62 84, 68 68, 62 52 C 56 36, 58 20, 62 8 Z"/>
      <path fill="#ffffff" d="M40 34 C 32 46, 22 58, 26 74 C 29 86, 40 93, 52 93 C 42 84, 38 72, 42 60 C 45 50, 44 42, 40 34 Z"/>
    </svg>
  </div>
</section>

<nav class="filters" id="filters" aria-label="Categorías"></nav>

<main class="library" id="library" aria-live="polite"></main>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <button class="sheet-close" id="sheetClose" aria-label="Cerrar">✕</button>
    <div id="sheetContent"></div>
  </div>
</div>

<div class="player" id="player">
  <div class="player-info">
    <div class="player-cover" id="playerCover">
      <img src="img/logo.png" alt=""
           onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
        <circle cx="50" cy="50" r="50" fill="#0d0d0d"/>
        <path fill="#ffffff" d="M62 8 C 58 26, 76 40, 78 60 C 80 78, 66 92, 50 95 C 62 84, 68 68, 62 52 C 56 36, 58 20, 62 8 Z"/>
        <path fill="#ffffff" d="M40 34 C 32 46, 22 58, 26 74 C 29 86, 40 93, 52 93 C 42 84, 38 72, 42 60 C 45 50, 44 42, 40 34 Z"/>
      </svg>
    </div>
    <div class="player-meta">
      <strong id="playerTitle">Selecciona un audiolibro</strong>
      <span id="playerSubtitle">—</span>
    </div>
  </div>

  <div class="player-center">
    <div class="player-controls">
      <button id="btnPrev" title="Capítulo anterior" aria-label="Anterior">⏮</button>
      <button id="btnPlay" class="main" title="Reproducir / Pausar" aria-label="Reproducir">▶</button>
      <button id="btnNext" title="Capítulo siguiente" aria-label="Siguiente">⏭</button>
    </div>
    <div class="player-progress">
      <span id="curTime">0%</span>
      <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Progreso del capítulo">
      <span id="durTime">100%</span>
    </div>
  </div>

  <div class="player-right">
    <select class="voice-select" id="voiceSelect" aria-label="Voz" title="Voz"></select>
    <button class="speed" id="btnSpeed" title="Velocidad de lectura">1×</button>
  </div>
</div>

<script>
const LIBRARY = [
  {
    id:'genesis', title:'Génesis', author:'La Biblia · Reina Valera',
    category:'Antiguo Testamento', icon:'🌍', colors:['#1e3c72','#2a5298'],
    chapters:[
      { title:'Capítulo 1 · La Creación',

const voiceSelect   = $('#voiceSelect');
const btnSpeed      = $('#btnSpeed');

const state = {
  category: 'Todos',
  query: '',
  book: null,
  chapterIndex: 0,
  speed: 1,
  voices: [],
  voice: null
};

const SPEEDS = [0.75, 1, 1.25, 1.5, 2];

const tts = {
  paragraphs: [],
  index: 0,
  playing: false,
  utterance: null,
  wordSpans: [],
  charLengths: [],
  totalChars: 0
};

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
  ));
}
function gradientOf(c){ return `linear-gradient(145deg, ${c[0]}, ${c[1]})`; }
function setRangeProgress(el, pct){
  el.style.setProperty('--progress', Math.max(0, Math.min(100, pct)) + '%');
}
function pctFormat(p){ return Math.round(p) + '%'; }

const MALE_HINTS = [
  'diego','jorge','juan','carlos','pablo','raul','raúl',
  'miguel','enrique','alvaro','álvaro','andres','andrés',
  'male','masculin','masculino','hombre','emilio','ramiro'
];

function pickMasculineVoice(voices){
  const es = voices.filter(v => /^es/i.test(v.lang));
  const esMale = es.find(v => MALE_HINTS.some(h => v.name.toLowerCase().includes(h)));
  if (esMale) return esMale;
  if (es[0]) return es[0];
  const anyMale = voices.find(v => MALE_HINTS.some(h => v.name.toLowerCase().includes(h)));
  if (anyMale) return anyMale;
  return voices[0] || null;
}

function loadVoices(){
  const all = speechSynthesis.getVoices();
  if (!all.length) return;

  state.voices = all.slice().sort((a, b) => {
    const aEs = /^es/i.test(a.lang) ? 0 : 1;
    const bEs = /^es/i.test(b.lang) ? 0 : 1;
    return aEs - bEs || a.name.localeCompare(b.name);
  });

  voiceSelect.innerHTML = state.voices.map((v, i) =>
    `<option value="${i}">${escapeHTML(v.name)} · ${v.lang}</option>`
  ).join('');

  const chosen = pickMasculineVoice(state.voices);
  state.voice = chosen;
  voiceSelect.value = state.voices.indexOf(chosen);

  if (chosen && MALE_HINTS.some(h => chosen.name.toLowerCase().includes(h))){
    voiceSelect.title = `Voz masculina: ${chosen.name}`;
  } else {
    voiceSelect.title = `Voz: ${chosen ? chosen.name : 'no disponible'}`;
  }
}

voiceSelect.addEventListener('change', () => {
  const v = state.voices[Number(voiceSelect.value)];
  if (v) state.voice = v;
  if (tts.playing) restartCurrentParagraph();
});

if ('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
  setTimeout(loadVoices, 400);
}

function renderFilters(){
  const cats = ['Todos', ...new Set(LIBRARY.map(b => b.category))];
  filtersEl.innerHTML = cats.map(c =>
    `<button class="chip${c === state.category ? ' active' : ''}" data-cat="${escapeHTML(c)}">${escapeHTML(c)}</button>`
  ).join('');
}

function renderLibrary(){
  const q = state.query.trim().toLowerCase();
  const list = LIBRARY.filter(b => {
    const okCat = state.category === 'Todos' || b.category === state.category;
    const okQ = !q
      || b.title.toLowerCase().includes(q)
      || b.author.toLowerCase().includes(q)
      || b.category.toLowerCase().includes(q);
    return okCat && okQ;
  });

  if (!list.length){
    libraryEl.innerHTML = `
      <div class="empty">
        <div class="big">🔎</div>
        <strong>Sin resultados</strong>
        <p>Prueba con otro término o cambia de categoría.</p>
      </div>`;
    return;
  }

  libraryEl.innerHTML = list.map((b, i) => `
    <article class="card" data-id="${b.id}" style="animation-delay:${i * 40}ms">
      <div class="cover" style="background:${gradientOf(b.colors)}">
        <span class="cover-letter">${escapeHTML(b.title.charAt(0))}</span>
        <span class="cover-icon">${b.icon}</span>
        <button class="play-fab" data-play="${b.id}" aria-label="Reproducir ${escapeHTML(b.title)}">▶</button>
      </div>
      <div class="card-body">
        <span class="tag">${escapeHTML(b.category)}</span>
        <h3>${escapeHTML(b.title)}</h3>
        <p class="author">${escapeHTML(b.author)}</p>
        <div class="meta">🎧 ${b.chapters.length} ${b.chapters.length === 1 ? 'capítulo' : 'capítulos'}</div>
      </div>
    </article>
  `).join('');
}

function openChapterList(book){
  sheetContent.innerHTML = `
    <div class="sheet-head">
      <div class="sheet-cover" style="background:${gradientOf(book.colors)}">${book.icon}</div>
      <div>
        <h2>${escapeHTML(book.title)}</h2>
        <p>${escapeHTML(book.author)} · ${book.chapters.length} capítulos</p>
      </div>
    </div>
    <ol class="chapter-list" id="chapterList">
      ${book.chapters.map((ch, i) => {
        const isActive = state.book && state.book.id === book.id && state.chapterIndex === i;
        return `
          <li class="chapter-item${isActive ? ' active' : ''}" data-book="${book.id}" data-index="${i}">
            <span class="chapter-num">${i + 1}</span>
            <span class="ch-title">${escapeHTML(ch.title)}</span>
            <span class="ch-state">${isActive ? '🔊' : '▶'}</span>
          </li>`;
      }).join('')}
    </ol>
  `;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openReaderView(book, chapterIndex){
  const chapter = book.chapters[chapterIndex];
  const paragraphs = chapter.text.split(/\n\n+/);

  tts.wordSpans = [];
  const parasHTML = paragraphs.map((p, pi) => {
    const tokens = p.split(/(\s+)/);
    let charPos = 0;
    const spans = [];
    const words = tokens.map(tok => {
      if (/^\s+$/.test(tok) || tok === ''){
        charPos += tok.length;
        return tok;
      }
      const start = charPos;
      const end = charPos + tok.length;
      charPos = end;
      spans.push({ start, end });
      return `<span class="w" data-p="${pi}" data-start="${start}" data-end="${end}">${escapeHTML(tok)}</span>`;
    });
    tts.wordSpans.push(spans);
    return `<p class="para" id="para-${pi}" data-para="${pi}">${words.join('')}</p>`;
  }).join('');

  sheetContent.innerHTML = `
    <div class="reader-head">
      <span class="reader-badge">▶ Reproduciendo</span>
      <h3>${escapeHTML(chapter.title)}</h3>
    </div>
    <div class="reader-body" id="readerBody">${parasHTML}</div>
  `;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeSheet(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

function clearHighlight(){
  document.querySelectorAll('.reader-body span.w.hl').forEach(el => el.classList.remove('hl'));
  document.querySelectorAll('.reader-body p.current-para').forEach(el => el.classList.remove('current-para'));
}
function highlightParagraph(pi){
  const el = document.getElementById('para-' + pi);
  if (el) el.classList.add('current-para');
}
function highlightWord(pi, charIndex){
  const spans = tts.wordSpans[pi];
  if (!spans) return;
  const target = spans.find(s => charIndex >= s.start && charIndex < s.end);
  if (!target) return;
  const old = document.querySelector('.reader-body span.w.hl');
  if (old) old.classList.remove('hl');
  const el = document.querySelector(`.reader-body span.w[data-p="${pi}"][data-start="${target.start}"]`);
  if (el){
    el.classList.add('hl');
    const paraEl = document.getElementById('para-' + pi);
    if (paraEl){
      const rect = paraEl.getBoundingClientRect();
      const sheetRect = sheet.getBoundingClientRect();
      if (rect.top < sheetRect.top + 80 || rect.bottom > sheetRect.bottom - 20){
        paraEl.scrollIntoView({ behavior:'smooth', block:'center' });
      }
    }
  }
}

function prepareReading(book, chapterIndex){
  state.book = book;
  state.chapterIndex = chapterIndex;

  const chapter = book.chapters[chapterIndex];
  tts.paragraphs = chapter.text.split(/\n\n+/);
  tts.charLengths = tts.paragraphs.map(p => p.length);
  tts.totalChars = tts.charLengths.reduce((a,b) => a+b, 0) || 1;
  tts.index = 0;
  tts.playing = false;

  player.classList.add('visible');
  playerCover.style.background = gradientOf(book.colors);
  playerCover.innerHTML = `<span style="font-size:22px;display:grid;place-items:center;width:100%;height:100%;color:#fff">${book.icon}</span>`;
  playerTitle.textContent = chapter.title;
  playerSubtitle.textContent = `${book.title} · ${book.author}`;

  updateProgressUI(0, 1);
  btnPlay.textContent = '▶';
}

function speakCurrentParagraph(){
  if (!('speechSynthesis' in window)){
    alert('Tu navegador no soporta síntesis de voz.');
    return;
  }
  speechSynthesis.cancel();

  const pi = tts.index;
  const text = tts.paragraphs[pi];
  if (text === undefined) return;

  const u = new SpeechSynthesisUtterance(text);
  if (state.voice) u.voice = state.voice;
  u.lang = state.voice ? state.voice.lang : 'es-ES';
  u.rate = state.speed;
  u.pitch = 0.95;

  clearHighlight();
  highlightParagraph(pi);

  u.onboundary = (e) => {
    if (e.name === 'word' || e.name === undefined){
      highlightWord(pi, e.charIndex);
      const frac = text.length ? e.charIndex / text.length : 0;
      updateProgressUI(pi + frac, tts.paragraphs.length);
    }
  };

  u.onend = () => {
    if (!tts.playing) return;
    if (tts.index < tts.paragraphs.length - 1){
      tts.index++;
      speakCurrentParagraph();
    } else {
      const next = state.chapterIndex + 1;
      if (next < state.book.chapters.length){
        loadChapter(state.book, next, true);
      } else {
        tts.playing = false;
        btnPlay.textContent = '▶';
        updateProgressUI(tts.paragraphs.length, tts.paragraphs.length);
      }
    }
  };

  u.onerror = (e) => {
    console.warn('TTS error:', e.error);
    tts.playing = false;
    btnPlay.textContent = '▶';
  };

  tts.utterance = u;
  speechSynthesis.speak(u);
}

function restartCurrentParagraph(){
  if (!tts.playing) return;
  speechSynthesis.cancel();
  setTimeout(speakCurrentParagraph, 60);
}

function playPause(){
  if (!state.book){
    const first = LIBRARY[0];
    loadChapter(first, 0, true);
    return;
  }

  if (tts.playing){
    tts.playing = false;
    speechSynthesis.pause();
    btnPlay.textContent = '▶';
  } else {
    tts.playing = true;
    btnPlay.textContent = '⏸';
    if (speechSynthesis.paused && tts.utterance){
      speechSynthesis.resume();
    } else {
      speakCurrentParagraph();
    }
  }
}

function nextChapter(){
  if (!state.book) return;
  const next = state.chapterIndex + 1;
  if (next < state.book.chapters.length) loadChapter(state.book, next, tts.playing);
}

function prevChapter(){
  if (!state.book) return;
  const prev = state.chapterIndex - 1;
  if (prev >= 0) loadChapter(state.book, prev, tts.playing);
}

function loadChapter(book, index, autoplay = true){
  if (!book || !book.chapters[index]) return;
  speechSynthesis.cancel();
  openReaderView(book, index);
  prepareReading(book, index);
  if (autoplay){
    tts.playing = true;
    btnPlay.textContent = '⏸';
    setTimeout(speakCurrentParagraph, 120);
  } else {
    btnPlay.textContent = '▶';
  }
}

function updateProgressUI(indexFloat, total){
  const pct = total ? Math.min(100, (indexFloat / total) * 100) : 0;
  seek.value = pct;
  setRangeProgress(seek, pct);
  curTimeEl.textContent = pctFormat(pct);
  durTimeEl.textContent = '100%';
}

seek.addEventListener('input', () => {
  const pct = Number(seek.value);
  setRangeProgress(seek, pct);
  curTimeEl.textContent = pctFormat(pct);
});
seek.addEventListener('change', () => {
  if (!state.book) return;
  const pct = Number(seek.value);
  const targetChars = (pct / 100) * tts.totalChars;
  let acc = 0, target = 0;
  for (let i = 0; i < tts.charLengths.length; i++){
    if (acc + tts.charLengths[i] > targetChars){ target = i; break; }
    acc += tts.charLengths[i];
    target = i + 1;
  }
  target = Math.min(target, tts.paragraphs.length - 1);
  tts.index = target;
  if (tts.playing) speakCurrentParagraph();
  else {
    clearHighlight();
    highlightParagraph(target);
    updateProgressUI(target, tts.paragraphs.length);
  }
});

btnSpeed.addEventListener('click', () => {
  const i = SPEEDS.indexOf(state.speed);
  state.speed = SPEEDS[(i + 1) % SPEEDS.length];
  btnSpeed.textContent = state.speed + '×';
  if (tts.playing) restartCurrentParagraph();
});

filtersEl.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  state.category = chip.dataset.cat;
  filtersEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
  renderLibrary();
});

let searchTimer;
$('#search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = e.target.value;
    renderLibrary();
  }, 180);
});

libraryEl.addEventListener('click', (e) => {
  const fab = e.target.closest('.play-fab');
  if (fab){
    e.stopPropagation();
    const book = LIBRARY.find(b => b.id === fab.dataset.play);
    if (book) loadChapter(book, 0, true);
    return;
  }
  const card = e.target.closest('.card');
  if (card){
    const book = LIBRARY.find(b => b.id === card.dataset.id);
    if (book) openChapterList(book);
  }
});

document.addEventListener('click', (e) => {
  const item = e.target.closest('.chapter-item');
  if (!item) return;
  const book = LIBRARY.find(b => b.id === item.dataset.book);
  const idx = Number(item.dataset.index);
  if (book) loadChapter(book, idx, true);
});

$('#sheetClose').addEventListener('click', closeSheet);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });

$('#themeToggle').addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  $('#themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
});

btnPlay.addEventListener('click', playPause);
btnNext.addEventListener('click', nextChapter);
btnPrev.addEventListener('click', prevChapter);

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  switch (e.code){
    case 'Space':      e.preventDefault(); playPause(); break;
    case 'ArrowRight': if (e.shiftKey) nextChapter(); break;
    case 'ArrowLeft':  if (e.shiftKey) prevChapter(); break;
    case 'Escape':     closeSheet(); break;
  }
});

function init(){
  if (!('speechSynthesis' in window)){
    console.warn('Web Speech API no disponible en este navegador.');
  }
  renderFilters();
  renderLibrary();
  setRangeProgress(seek, 0);
}
init();
</script>
</body>
</html>
